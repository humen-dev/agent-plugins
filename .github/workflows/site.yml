name: Site

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - 'scripts/validate-marketplace.mjs'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - 'scripts/validate-marketplace.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pages' || format('site-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  tests:
    name: 'Site: tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Lint
        run: npm run lint
        working-directory: site

      - name: Typecheck
        run: npm run typecheck
        working-directory: site

      - name: Vitest
        run: npm test
        working-directory: site

      - name: Generate catalog
        run: node site/scripts/generate.mjs --out site/src/generated/catalog.json

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: E2E
        run: npm run e2e
        working-directory: site

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

      - name: Audit (warning only)
        working-directory: site
        run: |
          if ! out="$(npm audit --omit=dev --audit-level=high 2>&1)"; then
            s="$(printf '%s' "$out" | tail -n 5)"; s="${s//'%'/'%25'}"; s="${s//$'\r'/'%0D'}"; s="${s//$'\n'/'%0A'}"
            echo "::warning::npm audit: ${s}"
          fi

  build:
    name: 'Site: build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Generate catalog
        run: node site/scripts/generate.mjs --out site/src/generated/catalog.json

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Fixture check
        run: node site/scripts/check-fixtures.mjs site/src/generated/catalog.json

      - name: Size budgets
        run: node site/scripts/check-size.mjs site/dist

      - name: Lighthouse (report only)
        continue-on-error: true
        working-directory: site
        run: |
          npm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4173/agent-plugins/ && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/lighthouse"
          npx --no-install lighthouse http://localhost:4173/agent-plugins/ --quiet \
            --output=json --output=html --output-path="$RUNNER_TEMP/lighthouse/home" \
            --chrome-flags="--headless=new --no-sandbox"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('Lighthouse mobile, home: Performance '+Math.round(r.categories.performance.score*100)+', LCP '+(r.audits['largest-contentful-paint'].numericValue/1000).toFixed(2)+' s')" "$RUNNER_TEMP/lighthouse/home.report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: ${{ runner.temp }}/lighthouse/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: 'Site: deploy'
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
